module: tests

flags: [
    '-x', 'c++',
    '-std=c++17',
    '-I./src'
]

targets:
  pyi: 'tests.pyi'

units:
  arguments:
    source: 'src/arguments.h'
    targets:
      pb: 'src/arguments_py_auto.cpp'

    specs:
      'method@Arguments::ignore_me': {exclude: true}

      'method@Arguments::add':
        params:
          i: { default: 0}
          j: { default: 0}